{% extends "football_tracker/base.html" %}

{% block title %}Create Tournament{% endblock %}

{% block content %}
<div class="center-wrapper">
    <div class="main-box">
        <h1>Add a new Tournament</h1>
        {% if error %}
            <p style="color:red">{{ error }}</p>
        {% endif %}
        <form method="post">
            {% csrf_token %}
            <label for="name">Name: </label>
            <input type="text", id="name", name="name"><br><br>

            <label for="year">Year: </label>
            <input type="number", id="year", name="year"><br><br>

            <label for="final_winner">Finale Winner: </label>
            <select id="final_winner" name="final_winner">
                {% for club in clubs %}
                    <option value="{{ club.id }}">{{ club.club_name }}</option>
                {% endfor %}
            </select><br><br>

            <label for="final_second_place">Finale Loser: </label>
            <select id="final_second_place" name="final_second_place">
                {% for club in clubs %}
                    <option value="{{ club.id }}">{{ club.club_name }}</option>
                {% endfor %}
            </select><br><br>

            <label for="man_of_the_match">Man of the Match: </label>
            <select id="man_of_the_match" name="man_of_the_match">
                {% for player in players %}
                    <option value="{{ player.id }}">{{ player.first_name }} {{ player.last_name }}</option>
                {% endfor %}
            </select><br><br>

            <label for="winner_score">Winner Score: </label>
            <input type="number", id="winner_score", name="winner_score"><br><br>

            <label for="second_place_score">Loser Score: </label>
            <input type="number", id="second_place_score", name="second_place_score"><br><br>

            <label for="city">City: </label>
            <input type="text", id="city", name="city"><br><br>

            <label for="venue">Venue: </label>
            <input type="text", id="venue", name="venue"><br><br>
            
            <button type="submit">Create</button>
        </form>
    </div>
</div>
{% endblock %}
