{% extends "football_tracker/base.html" %}

{% block title %}Create Player{% endblock %}

{% block content %}
<h1>Add a new Player</h1>
{% if error %}
    <p style="color:red">{{ error }}</p>
{% endif %}
<form method="post">
    {% csrf_token %}
    <label for="first_name">First Name:</label>
    <input type="text", id="first_name", name="first_name"><br><br>

    <label for="last_name">Last Name:</label>
    <input type="text", id="last_name", name="last_name"><br><br>

    <label for="birth_date">Born: </label>
    <input type="date", id="birth_date", name="birth_date"><br><br>

    <label for="nationality">Nationality: </label>
    <input type="text", id="nationality", name="nationality", placeholder="eg. POL, GER"><br><br>

    <label for="preffered_foot">Preferred Foot: </label>
    <select id="preffered_foot", name="preffered_foot">
        <option value="R">Right</option>
        <option value="L">Left</option>
    </select><br><br>

    <label for="height">Height (in cm): </label>
    <input type="number", id="height", name="height"><br><br>

    <label for="position">Position: </label>
    <select id="position", name="position">
        <option value="GK">Goalkeeper</option>
        <option value="DF">Defender</option>
        <option value="MF">Midfielder</option>
        <option value="FW">Forward</option>
    </select><br><br>

    <label for="club">Club: </label>
    <select id="club" name="club">
        {% for c in clubs %}
            <option value="{{ c.id }}">{{ c.club_name }}</option>
        {% endfor %}
    </select><br><br>

    <button type="submit">Create</button>
</form>
{% endblock %}
