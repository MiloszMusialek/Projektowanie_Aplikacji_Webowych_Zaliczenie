{% extends "football_tracker/base.html" %}

{% block title %}{% endblock %}

{% block content %}
<h1>Update Player</h1>
{% if error %}
    <p style="color:red">{{ error }}</p>
{% endif %}
<form method="post">
    {% csrf_token %}
    <label for="first_name">First Name:</label>
    <input type="text", id="first_name", name="first_name", value="{{ player.first_name }}"><br><br>

    <label for="last_name">Last Name:</label>
    <input type="text", id="last_name", name="last_name", value="{{ player.last_name }}"><br><br>

    <label for="birth_date">Born: </label>
    <input type="date", id="birth_date", name="birth_date", value="{{ player.birth_date|date:'Y-m-d' }}"><br><br>

    <label for="nationality">Nationality: </label>
    <input type="text", id="nationality", name="nationality", placeholder="eg. POL, GER", value="{{ player.nationality }}"><br><br>

    <label for="preffered_foot">Preferred Foot: </label>
    <select id="preffered_foot", name="preffered_foot">
        <option value="R" {% if player.preffered_foot == "R" %}selected{% endif %}>Right</option>
        <option value="L" {% if player.preffered_foot == "L" %}selected{% endif %}>Left</option>
    </select><br><br>

    <label for="height">Height (in cm): </label>
    <input type="number", id="height", name="height", value="{{ player.height }}"><br><br>

    <label for="position">Position: </label>
    <select id="position", name="position">
        <option value="GK" {% if player.position == "GK" %}selected{% endif %}>Goalkeeper</option>
        <option value="DF" {% if player.position == "DF" %}selected{% endif %}>Defender</option>
        <option value="MF" {% if player.position == "MF" %}selected{% endif %}>Midfielder</option>
        <option value="FW" {% if player.position == "FW" %}selected{% endif %}>Forward</option>
    </select><br><br>

    <label for="club">Club: </label>
    <select id="club" name="club">
        {% for c in clubs %}
            <option value="{{ c.id }}" {% if c.id == player.club_id %}selected{% endif %}>{{ c.club_name }}</option>
        {% endfor %}
    </select><br><br>

    <button type="submit">Update</button>
</form>
{% endblock %}
