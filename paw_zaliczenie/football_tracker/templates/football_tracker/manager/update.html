{% extends "football_tracker/base.html" %}

{% block title %}Update Manager{% endblock %}

{% block content %}
<div class="center-wrapper">
    <div class="main-box">
        <form method="post">
            {% csrf_token %}
            <label for="first_name">First Name:</label>
            <input type="text", id="first_name", name="first_name", value="{{ manager.first_name }}"><br><br>

            <label for="last_name">Last Name:</label>
            <input type="text", id="last_name", name="last_name", value="{{ manager.last_name }}"><br><br>

            <label for="birth_date">Born: </label>
            <input type="date", id="birth_date", name="birth_date", value="{{ manager.birth_date|date:'Y-m-d' }}"><br><br>

            <label for="nationality">Nationality: </label>
            <input type="text", id="nationality", name="nationality", value="{{ manager.nationality }}"><br><br>

            <button type="submit">Update</button>
        </form>
    </div>
</div>
<h1>Update Manager</h1>
{% if error %}
    <p style="color:red">{{ error }}</p>
{% endif %}
{% endblock %}
