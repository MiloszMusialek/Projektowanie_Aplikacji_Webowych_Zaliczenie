{% extends "football_tracker/base.html" %}

{% block title %}Create Manager{% endblock %}

{% block content %}
<div class="center-wrapper">
    <div class="main-box">
        <h1>Add a new Manager</h1>
        {% if error %}
            <p style="color:red">{{ error }}</p>
        {% endif %}
        <form method="post">
            {% csrf_token %}
            <label for="first_name">First Name:</label>
            <input type="text", id="first_name", name="first_name"><br><br>

            <label for="last_name">Last Name:</label>
            <input type="text", id="last_name", name="last_name"><br><br>

            <label for="birth_date">Born: </label>
            <input type="date", id="birth_date", name="birth_date"><br><br>

            <label for="nationality">Nationality: </label>
            <input type="text", id="nationality", name="nationality"><br><br>

            <button type="submit">Create</button>
        </form>
    </div>
</div>
{% endblock %}
