{% extends "football_tracker/base.html" %}

{% block title %}List League{% endblock %}
{% block content %}]
<div class="center-wrapper">
    <div class="main-box">
        <form method="get">
            <input type="text", name="search", placeholder="Search leagues", value="{{ seach_query }}">
            <button type="submit">Filter</button>
            {% if perms.football_tracker.add_league %}
                <a href="{% url 'league-create' %}">Add</a>
            {% endif %}
        </form>
        <div>
            {% for league in leagues %}
                <a href="{% url 'league-details' league.id %}">
                    <p>{{ league.league_name }}</p>
                </a>
            {% endfor %}   
        </div>
    </div>
</div>
{% endblock %}
