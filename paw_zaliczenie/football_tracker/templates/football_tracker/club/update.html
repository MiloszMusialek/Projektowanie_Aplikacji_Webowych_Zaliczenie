{% extends "football_tracker/base.html" %}

{% block title %}Update Club{% endblock %}

{% block content %}
<div class="center-wrapper">
    <div class="main-box">
        <h1>Update Club</h1>
        {% if error %}
            <p style="color:red">{{ error }}</p>
        {% endif %}
        <form method="post">
            {% csrf_token %}
            <label for="club_name">Name:</label>
            <input type="text", id="club_name", name="club_name", value="{{ club.club_name }}"><br><br>

            <label for="foundation_year">Founded:</label>
            <input type="number", id="foundation_year", name="foundation_year", value="{{ club.foundation_year }}"><br><br>

            <label for="stadium">Stadium: </label>
            <input type="text", id="stadium", name="stadium", value="{{ club.stadium }}"><br><br>

            <label for="manager">Manager: </label>
            <select id="manager" name="manager">
                {% for m in managers %}
                    <option value="{{ m.id }}"{% if m.id == club.manager_id %}selected{% endif %}>{{ m.first_name }} {{ m.last_name }}</option>
                {% endfor %}
            </select><br><br>

            <label for="league">League: </label>
            <select id="league" name="league">
                {% for l in leagues %}
                    <option value="{{ l.id }}"{% if l.id == club.league_id %}selected{% endif %}>{{ l.league_name }}</option>
                {% endfor %}
            </select><br><br>

            <button type="submit">Update</button>
        </form>
    </div>
</div>
{% endblock %}
